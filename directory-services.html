<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Directory Services | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="access" data-page="directory" data-crumb="Directory Services">
<main class="main" id="main">
  <div class="page-title"><h1>Directory Services</h1><span class="muted">IdP / AD とのユーザー同期</span></div>
  <div class="tip"><span><b>選び方：</b>SCIM（推奨・ほぼリアルタイム・社内FWの受信許可不要）＞ LDAP（1日1回 0:00 GMT に同期、オンプレADは受信許可が必要）＞ 手動作成（少人数のみ）。</span></div>
  <div class="card">
    <div class="subtabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" type="button" data-t="scim">SCIM</button>
      <button role="tab" aria-selected="false" type="button" data-t="ldap">LDAP</button>
      <button role="tab" aria-selected="false" type="button" data-t="prov">User Provisioning</button>
    </div>
    <div class="card-b" id="body"></div>
  </div>
</main>
<script src="assets/app.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  let cfg = App.db.get("dir", { scim: [{ idp: "Microsoft Entra ID", status: "Active", lastSync: Date.now() - 12 * 60e3, users: 6 }], ldap: { enabled: false, domain: "", bind: "", base: "" }, onboarding: true });
  const T = {
    scim: function () {
      return '<div class="btn-group" style="margin-bottom:12px"><button class="btn btn-primary" id="newScim" type="button">＋ New SCIM App</button></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Identity Provider</th><th>Status</th><th>Last Sync</th><th>Synced Users</th><th></th></tr></thead><tbody>' +
        cfg.scim.map(function (s, i) {
          return "<tr><td>" + App.esc(s.idp) + "</td><td>" + (s.status === "Active" ? '<span class="badge b-ok">Active</span>' : '<span class="badge b-warn">' + App.esc(s.status) + "</span>") + '</td><td class="num">' + (s.lastSync ? App.fmt(s.lastSync) : "—") + '</td><td class="num">' + s.users + '</td><td><button class="btn" type="button" data-sync="' + i + '">Sync Status</button></td></tr>';
        }).join("") + "</tbody></table></div>" +
        '<p class="muted" style="margin-top:12px">同期エラーは Monitoring > イベント の Event Type = <b>System</b> で確認できます。</p>';
    },
    ldap: function () {
      return '<div style="max-width:620px"><label class="switch" style="margin-bottom:14px"><input type="checkbox" id="lEn" ' + (cfg.ldap.enabled ? "checked" : "") + '><span class="track"></span>Enable LDAP Sync</label>' +
        '<div class="field"><label for="lDom">Domain Name</label><input class="input" id="lDom" value="' + App.esc(cfg.ldap.domain) + '" placeholder="例：corp.example.co.jp"></div>' +
        '<div class="field"><label for="lBind">Bind DN</label><input class="input" id="lBind" value="' + App.esc(cfg.ldap.bind) + '" placeholder="例：CN=kato-sync,OU=Service,DC=corp,DC=example,DC=co,DC=jp"></div>' +
        '<div class="field"><label for="lBase">Base DN</label><input class="input" id="lBase" value="' + App.esc(cfg.ldap.base) + '" placeholder="例：OU=Users,DC=corp,DC=example,DC=co,DC=jp"><span class="help">同期は 24 時間ごと（0:00 GMT）。オンプレ AD の場合、Kato からの LDAP 受信を許可する FW ルールが必要です。</span></div>' +
        '<button class="btn btn-primary" id="lSave" type="button">Save</button></div>';
    },
    prov: function () {
      return '<div style="max-width:620px"><label class="switch"><input type="checkbox" id="onb" ' + (cfg.onboarding ? "checked" : "") + '><span class="track"></span>Send activation (onboarding) email to new SDP users</label>' +
        '<p class="muted" style="margin:10px 0 14px">SDP ライセンスを持つユーザーにだけ、Kato Client の導入案内メールが送られます。MDM（Intune など）で Client を一括配布する場合はオフにすることもあります。</p>' +
        '<button class="btn btn-primary" id="pSave" type="button">Save</button></div>';
    }
  };
  function show(t) {
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.t === t)); });
    document.getElementById("body").innerHTML = T[t]();
    const ns = document.getElementById("newScim");
    if (ns) ns.onclick = function () {
      App.panel({
        title: "New SCIM App", model: { idp: "Okta", token: "" },
        sections: [{ title: "General", open: true, fields: [
          { key: "idp", label: "Identity Provider", type: "select", options: ["Microsoft Entra ID", "Okta", "OneLogin", "OneWelcome", "Custom SCIM App"] },
          { type: "info", key: "_i", html: "<span>［Apply］すると <b>SCIM URL</b> と <b>Bearer Token</b> が発行されます。IdP 側のプロビジョニング設定に貼り付けて接続します（トークンは発行時しか表示されないので控えておく）。</span>" }
        ] }],
        onApply: function (m) {
          cfg.scim.push({ idp: m.idp, status: "Waiting for IdP", lastSync: null, users: 0 }); App.db.set("dir", cfg);
          App.audit("Directory Services", "Create", "SCIM App", m.idp);
          App.modal({ title: "SCIM 接続情報（研修用ダミー）", cancel: "", ok: "控えた",
            body: '<div class="field"><span class="lbl">SCIM URL</span><code class="mono">https://scimservice.example.invalid/scim/v2/' + Math.random().toString(36).slice(2, 10) + '</code></div><div class="field"><span class="lbl">Bearer Token</span><code class="mono">TRAINING-' + Math.random().toString(36).slice(2, 18).toUpperCase() + "</code></div>" });
          show("scim");
        }
      });
    };
    document.querySelectorAll("[data-sync]").forEach(function (b) { b.onclick = function () { const s = cfg.scim[+b.dataset.sync]; App.toast(s.idp + "：" + (s.status === "Active" ? "直近の同期は成功しています（" + s.users + " users）。" : "IdP 側でプロビジョニングを開始してください。"), s.status === "Active" ? "ok" : "warn"); }; });
    const ls = document.getElementById("lSave");
    if (ls) ls.onclick = function () {
      cfg.ldap = { enabled: document.getElementById("lEn").checked, domain: document.getElementById("lDom").value, bind: document.getElementById("lBind").value, base: document.getElementById("lBase").value };
      App.db.set("dir", cfg); App.audit("Directory Services", "Update", "LDAP", cfg.ldap.enabled ? "Enabled" : "Disabled"); App.toast("LDAP 設定を保存しました。", "ok");
    };
    const ps = document.getElementById("pSave");
    if (ps) ps.onclick = function () { cfg.onboarding = document.getElementById("onb").checked; App.db.set("dir", cfg); App.toast("保存しました。", "ok"); };
  }
  document.addEventListener("DOMContentLoaded", function () {
    show("scim");
    document.querySelectorAll("#tabs button").forEach(function (b) { b.onclick = function () { show(b.dataset.t); }; });
  });
})();
</script>

</body>
</html>
