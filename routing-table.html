<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routing Table | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="monitoring" data-page="routing-table" data-crumb="Routing Table">
<main class="main" id="main">
  <div class="page-title"><h1>Routing Table</h1><span class="muted">拠点から見た経路（どの宛先へどこを通るか）</span><div class="btn-group" style="margin-left:auto"><select class="select" id="site" style="width:auto" aria-label="サイト" data-tip="どの拠点から見た経路かを選びます。"></select></div></div>
  <div class="tip"><span><b>使い方：</b>「他拠点に通信できない」ときに、宛先のアドレスへの経路があるかを確認します。経路が <b>Withdrawn（取り下げ）</b> になっていれば、宛先拠点の切断や BGP の問題が原因です。行にマウスを乗せると経路の意味が出ます。</span></div>
  <div class="toolbar-row"><div class="search" style="position:relative;min-width:240px"><svg class="icon" viewBox="0 0 24 24" style="position:absolute;left:8px;top:8px;color:var(--muted)"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input class="input" id="q" placeholder="IP アドレスで経路を検索（例：172.16.1.10）" style="padding-left:30px" aria-label="IP アドレスで検索"></div><span class="muted" id="res"></span></div>
  <div class="card"><div id="tbl"></div></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  const sites = App.sites();
  function ip2n(ip) { return ip.split(".").reduce(function (a, b) { return a * 256 + (+b); }, 0); }
  function inCidr(ip, c) { const p = c.split("/"); const m = +p[1]; const mask = m === 0 ? 0 : (0xffffffff << (32 - m)) >>> 0; return ((ip2n(ip) & mask) >>> 0) === ((ip2n(p[0]) & mask) >>> 0); }
  function routes(sid) {
    const me = sites.find(function (s) { return s.id === sid; });
    const r = [];
    sites.forEach(function (s) {
      if (s.id === sid) r.push({ p: s.native, nh: "LAN（Native）", type: "Native", origin: s.name, st: "Active" });
      else r.push({ p: s.native, nh: "Kato Cloud → " + s.name, type: "Kato", origin: s.name, st: s.status === "Connected" ? "Active" : "Withdrawn" });
    });
    if (sid === "s1") r.push({ p: "10.11.0.0/22", nh: "10.10.0.254（Core L3 SW）", type: "Routed", origin: me.name, st: "Active" }, { p: "192.168.100.0/24", nh: "BGP peer 10.10.0.254（AS 65010）", type: "BGP", origin: "旧MPLS網", st: "Active" });
    else r.push({ p: "10.11.0.0/22", nh: "Kato Cloud → JP-TKY-HQ", type: "Kato", origin: "JP-TKY-HQ", st: "Active" });
    r.push({ p: "10.250.0.0/16", nh: "Kato Cloud（SDP Users）", type: "Kato", origin: "SDP Range", st: "Active" }, { p: "0.0.0.0/0", nh: "Kato Cloud（Internet）", type: "Default", origin: "—", st: "Active" });
    return r;
  }
  const TIP = { Native: "この拠点自身の LAN。Sokket に直接つながっています。", Routed: "L3 スイッチの先にあるネットワーク（Routed Range）。", BGP: "BGP で既存ルータから学習した経路（MPLS との並行稼働など）。", Kato: "Kato Cloud 経由で他の拠点・リモートユーザーへ届く経路。", Default: "どれにも当たらない宛先はインターネットへ（デフォルトルート）。" };
  function draw() {
    const sid = document.getElementById("site").value, q = document.getElementById("q").value.trim();
    let list = routes(sid);
    let msg = "";
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(q)) {
      const hit = list.filter(function (r) { return inCidr(q, r.p); }).sort(function (a, b) { return +b.p.split("/")[1] - +a.p.split("/")[1]; });
      msg = hit.length ? q + " は「" + hit[0].p + "」（" + hit[0].type + "）で届きます（最も長く一致した経路）" + (hit[0].st === "Withdrawn" ? "。ただしこの経路は取り下げ中のため、通信できません。" : "。") : "";
      list = hit;
    }
    document.getElementById("res").textContent = msg;
    document.getElementById("tbl").innerHTML = App.table(["Prefix", "Next Hop", "Type", "Origin", "Status"], list.map(function (r) {
      return { tip: "【" + r.p + "】" + TIP[r.type] + "\n次の行き先：" + r.nh + (r.st === "Withdrawn" ? "\n取り下げ中：宛先拠点が切断されているため、この宛先には届きません。" : ""), cls: r.st === "Withdrawn" ? "disabled-rule" : "",
        cells: ['<span class="mono">' + r.p + "</span>", App.esc(r.nh), '<span class="badge ' + (r.type === "BGP" ? "b-info" : r.type === "Native" ? "b-ok" : "b-gray") + '">' + r.type + "</span>", App.esc(r.origin), r.st === "Active" ? '<span class="badge b-ok">Active</span>' : '<span class="badge b-ng">Withdrawn</span>'] };
    }));
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("site").innerHTML = sites.map(function (s) { return '<option value="' + s.id + '">' + App.esc(s.name) + "</option>"; }).join("");
    document.getElementById("site").onchange = draw; document.getElementById("q").oninput = draw; draw();
  });
})();
</script>

</body>
</html>
