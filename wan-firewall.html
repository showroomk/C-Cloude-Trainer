<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAN Firewall | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="security" data-page="wan-firewall" data-crumb="WAN Firewall">
<main class="main" id="main">
  <div class="page-title"><h1>WAN Firewall</h1><span class="muted">拠点・リモートユーザー・クラウド間の通信制御</span></div>
  <div class="tip"><span><b>ホワイトリスト型：</b>一番下の既定ルールは <b>ANY ANY Block</b>。許可していない社内通信はすべて遮断されます。新しい業務システムを追加したら、ここに許可ルールが必要か確認します。「Firewall Enabled」をオフにするとアクセス制御が一切なくなるため、通常は触りません。</span></div>
  <div id="pol"></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/lab-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n-en-kmc.js"></script>
<script src="assets/i18n-en-pages.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
App.policy({
  mount: "#pol", key: "wan", title: "WAN Firewall", ruleNoun: "WAN Firewall Rule",
  hasEnable: true, enableLabel: "Firewall Enabled", enabledText: "有効（ルールに従って制御）", disabledText: "無効：アクセス制御なし。全員がすべての社内リソースに到達できます",
  enableWarnOff: "WAN Firewall を無効にすると<b>アクセス制御が一切なくなり</b>、誰でもすべての社内リソースに到達できるようになります。本当に無効にしますか？",
  seed: function () { return { enabled: true, rules: [
    { id: "w1", name: "HQ to All Sites", enabled: true, source: ["Site: JP-TKY-HQ"], direction: "Both", dest: [], app: [], service: [], action: "Allow", track: true },
    { id: "w2", name: "Users to FileServer (SMB)", enabled: true, source: ["SDP Users (all)", "Site: JP-OSA-BR01"], direction: "→", dest: ["Host: FileServer (10.10.0.20)"], app: [], service: ["SMB"], action: "Allow", track: true },
    { id: "w3", name: "Branch to ERP on AWS", enabled: true, source: ["Site: JP-OSA-BR01"], direction: "→", dest: ["Host: ERP (172.16.1.10)"], app: [], service: ["HTTPS"], action: "Allow", track: true },
    { id: "w4", name: "Block RDP from SDP Users", enabled: true, source: ["SDP Users (all)"], direction: "→", dest: [], app: [], service: ["RDP"], action: "Block", track: true }
  ] }; },
  newRule: function () { return { name: "", enabled: true, source: [], direction: "→", dest: [], app: [], service: [], action: "Allow", track: true }; },
  columns: [
    { h: "Name", v: function (r) { return App.esc(r.name) + (r._new ? ' <span class="badge b-info">New</span>' : ""); } },
    { h: "Source", v: function (r) { return App.chipsCell(r.source); } },
    { h: "Dir", v: function (r) { return r.direction === "Both" ? "⇄" : "→"; } },
    { h: "Destination", v: function (r) { return App.chipsCell(r.dest); } },
    { h: "App/Category", v: function (r) { return App.chipsCell(r.app); } },
    { h: "Service/Port", v: function (r) { return App.chipsCell(r.service); } },
    { h: "Action", v: function (r) { return App.actionBadge(r.action); } }
  ],
  generalExtra: [{ key: "direction", label: "Direction", type: "select", options: [["→", "→（Source から Destination）"], ["Both", "Both（双方向）"]] }],
  sections: [
    { title: "Source", fields: [{ key: "source", label: "Source", type: "picker", options: App.opt.sources }] },
    { title: "Destination", fields: [{ key: "dest", label: "Destination", type: "picker", options: App.opt.destinations, help: "空のままなら Any。" }] },
    { title: "App/Category", fields: [{ key: "app", label: "App/Category", type: "picker", options: App.opt.apps }] },
    { title: "Service/Port", fields: [{ key: "service", label: "Service/Port", type: "picker", options: App.opt.services }] },
    { title: "Action", fields: [{ key: "action", label: "Action", type: "select", options: ["Allow", "Block", "Prompt"] }], summary: function (m) { return m.action; } },
    { title: "Track", fields: [{ key: "track", label: "Generate Events", type: "toggle" }], summary: function (m) { return m.track ? "Event" : "None"; } }
  ],
  implicitBottom: { tip: "【既定ルール：Any Any Block】どのルールにも一致しなかった社内通信はすべて遮断されます（ホワイトリスト型）。通したい通信は、この上に Allow ルールを追加します。", cells: ["<b>Default</b>（implicit）", '<span class="muted">Any</span>', "⇄", '<span class="muted">Any</span>', '<span class="muted">Any</span>', '<span class="muted">Any</span>', App.actionBadge("Block")] },
  onPublish: function (pub, prev) {
    if (pub.rules.some(function (r) { return r.action === "Allow" && !prev.rules.some(function (p) { return p.id === r.id; }); })) App.complete("wan_rule");
  }
});
</script>

</body>
</html>
