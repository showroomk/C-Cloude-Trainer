<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topology | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="monitoring" data-page="topology" data-crumb="Topology">
<style>
  .topo-head { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; }
  .topo-head > * { display: flex; align-items: center; }
  .topo-title { padding: 0 22px; font-size: 15px; font-weight: 500; min-width: 120px; }
  .ico-blk { background: var(--slate); color: #fff; width: 32px; justify-content: center; }
  .ico-blk .icon { width: 18px; height: 18px; }
  .stat { gap: 6px; padding: 0 14px; font-size: 12px; color: var(--muted); }
  .stat b { font-size: 17px; font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat.ok b { color: var(--ok); } .stat.ng b { color: var(--ng); }
  .stat-sep { width: 10px; position: relative; }
  .stat-sep::after { content: ""; position: absolute; top: 12px; bottom: 12px; left: 2px; width: 8px; border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); transform: skewX(25deg); border-top: 0; }
  .topo-search { flex: 1; padding: 0 14px; min-width: 200px; position: relative; }
  .topo-search .icon { position: absolute; left: 24px; color: var(--muted); }
  .topo-search input { padding-left: 32px; max-width: 460px; }
  .topo-refresh { border: 0; border-left: 1px solid var(--line); background: none; width: 46px; justify-content: center; cursor: pointer; }
  .canvas { position: relative; height: min(68vh, 640px); min-height: 420px; overflow: hidden; background: #fff; }
  .zoom { position: absolute; left: 18px; top: 18px; display: grid; gap: 14px; z-index: 2; }
  .zoom button { border: 0; background: none; cursor: pointer; color: #555; padding: 2px; }
  .zoom .icon { width: 18px; height: 18px; }
  #topo { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .node { cursor: pointer; }
  .node:hover .nb, .node:focus .nb { stroke: var(--link); stroke-width: 3; }
  .node:focus { outline: none; }
  .node.dim { opacity: .25; }
  .lbl { font-size: 13px; fill: var(--text); }
  .lbl-sub { font-size: 11px; fill: var(--muted); }
  .legend-row { display: flex; gap: 18px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .hover-card { position: absolute; z-index: 3; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 3px; padding: 10px 12px; font-size: 12px; pointer-events: none; min-width: 200px; }
  .hover-card b { font-size: 13px; font-weight: 500; display: block; margin-bottom: 4px; }
</style>

<main class="main" id="main">
  <div class="tip"><span><b>毎朝の健康確認はここから。</b>赤い拠点は切断中です。クリックすると、その拠点の監視画面（Site Monitoring）に移動します。</span></div>
  <div class="card">
    <div class="topo-head">
      <div class="topo-title">Topology</div>
      <div class="ico-blk">${site}</div>
      <div class="stat" data-tip="登録されている拠点（サイト）の数。正常時の数（ベースライン）と比べます。"><b id="nSites">0</b> サイト</div>
      <div class="stat-sep" aria-hidden="true"></div>
      <div class="stat ok" data-tip="接続中の拠点数。"><b id="nConn">0</b> Connected</div>
      <div class="stat ng" data-tip="切断中の拠点数。0 でなければ赤い拠点をクリックして原因を確認します。"><b id="nDisc">0</b> Disconnected</div>
      <div class="ico-blk">${users}</div>
      <div class="stat" data-tip="いま Kato Client で接続しているリモートユーザーの数。"><b id="nSdp">0</b> Connected SDP Users</div>
      <div class="topo-search">${search}<input class="input" id="topoSearch" placeholder="Search" aria-label="サイトを検索"></div>
      <button class="topo-refresh" id="refresh" type="button" aria-label="更新">${refresh}</button>
    </div>
    <div class="canvas" id="canvas">
      <div class="zoom">
        <button type="button" id="zIn" aria-label="拡大">${plus}</button>
        <button type="button" id="zOut" aria-label="縮小">${minus}</button>
        <button type="button" id="zCenter" aria-label="中央に戻す">${locate}</button>
        <button type="button" id="zFit" aria-label="全体を表示">${shrink}</button>
        <button type="button" id="zRefresh" aria-label="再描画">${refresh}</button>
      </div>
      <svg id="topo" viewBox="0 0 1200 640" role="img" aria-label="拠点とKatoクラウドの接続状況"></svg>
      <div class="hover-card" id="hover" hidden></div>
    </div>
    <div class="legend-row"><span><span class="dot ok"></span>Connected（接続中）</span><span><span class="dot ng"></span>Disconnected（切断）</span><span><span class="dot warn"></span>Pending（Sokket未接続の新規サイト）</span><span>中央の青いリング＝Kato SASE Cloud（PoP とバックボーン）</span></div>
  </div>
</main>

<script src="assets/app.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  // ヘッダーのアイコン差し込み
  document.querySelectorAll(".topo-head, .zoom").forEach(function (el) {
    el.innerHTML = el.innerHTML.replace(/\$\{(\w+)\}/g, function (_, n) { return App.icon(n); });
  });
  const sites = App.sites();
  const sdpConnected = App.users().filter(function (u) { return u.connected; }).length;
  document.getElementById("nSites").textContent = sites.length;
  document.getElementById("nConn").textContent = sites.filter(function (s) { return s.status === "Connected"; }).length;
  document.getElementById("nDisc").textContent = sites.filter(function (s) { return s.status === "Disconnected"; }).length;
  document.getElementById("nSdp").textContent = sdpConnected;

  const svg = document.getElementById("topo");
  const cx = 600, cy = 330, R = 92;
  let scale = 1, tx = 0, ty = 0;
  const color = { Connected: "#6d86a2", Disconnected: "#d6333b", Pending: "#e58a00" };

  function nodeSVG(s, i) {
    const n = sites.length;
    const ang = (-100 + (360 / Math.max(n, 3)) * i) * Math.PI / 180;
    const dist = 250;
    const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist * 0.92;
    const ex = cx + Math.cos(ang) * (R + 20), ey = cy + Math.sin(ang) * (R + 20) * 0.92;
    const st = s.status === "Connected" ? "Connected" : s.status === "Disconnected" ? "Disconnected" : "Pending";
    const isCloud = /Cloud/.test(s.type);
    const c = color[st];
    const fill = st === "Connected" ? c : "#fff";
    const ic = st === "Connected" ? "#fff" : c;
    const glyph = isCloud
      ? '<path d="M-14 8a8 8 0 0 1-1-16 11 11 0 0 1 21 1 7.5 7.5 0 0 1-2 15z" fill="none" stroke="' + ic + '" stroke-width="2.2"/>'
      : '<rect x="-9" y="-14" width="18" height="28" rx="1.5" fill="none" stroke="' + ic + '" stroke-width="2.2"/><path d="M-4 -8h3M2 -8h3M-4 -2h3M2 -2h3M-4 4h3M2 4h3" stroke="' + ic + '" stroke-width="2"/>';
    const lblRight = x >= cx;
    const lx = lblRight ? x + 40 : x - 40;
    return '<line x1="' + ex.toFixed(1) + '" y1="' + ey.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + (st === "Disconnected" ? "#e7a3a6" : "#b9c2cc") + '" stroke-width="1.5" ' + (st === "Connected" ? "" : 'stroke-dasharray="5 4"') + '/>' +
      '<g class="node" tabindex="0" role="link" data-id="' + s.id + '" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')" aria-label="' + App.esc(s.name) + ' ' + st + '">' +
      '<circle class="nb" r="27" fill="' + fill + '" stroke="' + c + '" stroke-width="2"/>' + glyph +
      '<g transform="translate(' + (lblRight ? 34 : -64) + ',-12)"><rect width="30" height="22" fill="#fff" stroke="#e1e4e8"/><circle cx="15" cy="11" r="6" fill="#cc0000"/></g>' +
      '<text class="lbl" x="' + (lblRight ? 72 : -72) + '" y="-2" text-anchor="' + (lblRight ? "start" : "end") + '">' + App.esc(s.name) + '</text>' +
      '<text class="lbl-sub" x="' + (lblRight ? 72 : -72) + '" y="14" text-anchor="' + (lblRight ? "start" : "end") + '">' + App.esc(s.type) + ' · ' + (st === "Connected" ? "PoP " + App.esc(s.pop) : st) + '</text>' +
      '</g>';
  }

  function draw() {
    const q = document.getElementById("topoSearch").value.trim().toLowerCase();
    let sdp = "";
    for (let k = 0; k < sdpConnected; k++) {
      const a = (35 + k * 22) * Math.PI / 180;
      const x = cx + Math.cos(a) * 165, y = cy + Math.sin(a) * 150;
      sdp += '<line x1="' + (cx + Math.cos(a) * (R + 18)) + '" y1="' + (cy + Math.sin(a) * (R + 16)) + '" x2="' + x + '" y2="' + y + '" stroke="#cfd6dd"/>' +
        '<g data-tip="【接続中のリモートユーザー】Kato Client で接続している SDP ユーザーです。詳細は Access > ユーザー で確認します。" transform="translate(' + x + ',' + y + ')"><circle r="12" fill="#fff" stroke="#6d86a2" stroke-width="1.5"/><circle cy="-3" r="3.4" fill="none" stroke="#6d86a2" stroke-width="1.5"/><path d="M-6 7c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5" fill="none" stroke="#6d86a2" stroke-width="1.5"/></g>';
    }
    svg.innerHTML = '<g id="world" transform="translate(' + tx + ',' + ty + ') translate(' + cx + ',' + cy + ') scale(' + scale + ') translate(' + (-cx) + ',' + (-cy) + ')">' +
      sdp + sites.map(nodeSVG).join("") +
      '<g data-tip="【Kato SASE Cloud】PoP（接続拠点）とプライベートバックボーンを表します。拠点やユーザーは最寄りの PoP に自動で接続します。"><circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="#1f7bff" stroke-width="30"/></g>' +
      '</g>';
    if (q) svg.querySelectorAll(".node").forEach(function (n) {
      const s = sites.find(function (x) { return x.id === n.dataset.id; });
      if (!s.name.toLowerCase().includes(q)) n.classList.add("dim");
    });
    svg.querySelectorAll(".node").forEach(function (n) {
      const go = function () { App.db.set("selectedSite", n.dataset.id); location.href = "site.html"; };
      n.addEventListener("click", go);
      n.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      n.addEventListener("mouseenter", function () {
        const s = sites.find(function (x) { return x.id === n.dataset.id; });
        const h = document.getElementById("hover");
        h.innerHTML = "<b>" + App.esc(s.name) + "</b>" +
          '<div><span class="dot ' + (s.status === "Connected" ? "ok" : s.status === "Disconnected" ? "ng" : "warn") + '"></span>' + App.esc(s.status) + "</div>" +
          '<div class="muted">' + App.esc(s.conn) + " / " + App.esc(s.city) + "</div>" +
          '<div class="muted">クリックで Site Monitoring を開く</div>';
        const r = n.getBoundingClientRect(), c = document.getElementById("canvas").getBoundingClientRect();
        h.style.left = Math.min(r.left - c.left + 40, c.width - 230) + "px";
        h.style.top = Math.max(8, r.top - c.top - 10) + "px";
        h.hidden = false;
      });
      n.addEventListener("mouseleave", function () { document.getElementById("hover").hidden = true; });
    });
  }
  draw();
  document.getElementById("topoSearch").addEventListener("input", draw);
  document.getElementById("zIn").onclick = function () { scale = Math.min(2.2, scale + 0.2); draw(); };
  document.getElementById("zOut").onclick = function () { scale = Math.max(0.5, scale - 0.2); draw(); };
  document.getElementById("zCenter").onclick = function () { tx = 0; ty = 0; draw(); };
  document.getElementById("zFit").onclick = function () { scale = 1; tx = 0; ty = 0; draw(); };
  const refresh = function () { App.toast("トポロジーを更新しました。", "ok", 2000); draw(); };
  document.getElementById("zRefresh").onclick = refresh;
  document.getElementById("refresh").onclick = refresh;
  // ドラッグで移動
  let drag = null;
  svg.addEventListener("pointerdown", function (e) { if (e.target.closest(".node")) return; drag = { x: e.clientX, y: e.clientY, tx: tx, ty: ty }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const k = 1200 / svg.clientWidth;
    tx = drag.tx + (e.clientX - drag.x) * k; ty = drag.ty + (e.clientY - drag.y) * k;
    document.getElementById("world").setAttribute("transform", "translate(" + tx + "," + ty + ") translate(" + cx + "," + cy + ") scale(" + scale + ") translate(" + (-cx) + "," + (-cy) + ")");
  });
  svg.addEventListener("pointerup", function () { drag = null; });
})();
</script>

</body>
</html>
