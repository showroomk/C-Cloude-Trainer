<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Analytics | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="monitoring" data-page="app-analytics" data-crumb="App Analytics">
<main class="main" id="main">
  <div class="page-title"><h1>App Analytics</h1><span class="muted">アプリ別の利用状況</span><div class="btn-group" style="margin-left:auto"><select class="select" id="site" style="width:auto" aria-label="サイト" data-tip="対象の拠点（またはアカウント全体）を選びます。"></select><span id="trWrap"></span></div></div>
  <div class="tip"><span><b>使い方：</b>帯域を圧迫しているアプリを見つけたり、業務外の利用を把握したりします。棒や行にマウスを乗せると内訳、行をクリックすると詳細が出ます。帯域を圧迫しているアプリは Network Rules で優先度を下げられます。</span></div>
  <div class="grid2"><div id="c1"></div><div id="c2"></div></div>
  <div class="card"><div class="card-h"><h2>Applications</h2></div><div id="tbl"></div></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  const APPS = [["Microsoft 365", "Office", 412, 182, "Low"], ["YouTube", "Streaming Media", 288, 64, "Medium"], ["Microsoft Teams", "Collaboration", 254, 170, "Low"], ["Box", "File Sharing", 196, 88, "Low"], ["Windows Update", "Software Updates", 151, 140, "Low"],
    ["Zoom", "Collaboration", 133, 52, "Low"], ["Salesforce", "Business", 92, 41, "Low"], ["Dropbox", "File Sharing", 61, 9, "High"], ["Netflix", "Streaming Media", 44, 3, "Medium"], ["Unknown TLS", "Uncategorized", 17, 6, "High"]];
  function draw() {
    const f = document.getElementById("site").value === "all" ? 1 : document.getElementById("site").value === "s1" ? 0.62 : 0.31;
    const rows = APPS.map(function (a) { return { name: a[0], cat: a[1], gb: Math.round(a[2] * f), users: Math.max(1, Math.round(a[3] * f)), risk: a[4] }; });
    const tot = rows.reduce(function (s, r) { return s + r.gb; }, 0);
    document.getElementById("c1").innerHTML = App.card("Top Applications（通信量）", App.bars(rows.slice(0, 8).map(function (r) {
      return { label: r.name, value: r.gb, text: r.gb + " GB", color: r.risk === "High" ? "var(--ng)" : r.cat === "Streaming Media" ? "var(--warn)" : "var(--brand)", tip: r.name + "：" + r.gb + " GB（全体の " + Math.round(r.gb / tot * 100) + "%）／ 利用者 " + r.users + " 人" + (r.cat === "Streaming Media" ? "\n業務外の動画が帯域を使っています。優先度を下げる対象です。" : "") + (r.risk === "High" ? "\nリスクの高いアプリです。Application Control で制御を検討します。" : "") };
    })), { tip: "通信量の多いアプリ。オレンジ＝動画、赤＝高リスク。" });
    const cats = {}; rows.forEach(function (r) { cats[r.cat] = (cats[r.cat] || 0) + r.gb; });
    const cols = ["#0b66f0", "#6d86a2", "#e58a00", "#1a73e8", "#7a5bc0", "#d6333b", "#9aa0a6", "#3fa6c2"];
    document.getElementById("c2").innerHTML = App.card("カテゴリ別", App.donut(Object.entries(cats).sort(function (a, b) { return b[1] - a[1]; }).map(function (kv, i) { return { label: kv[0], value: kv[1], color: cols[i % 8], tip: kv[0] + "：" + kv[1] + " GB（" + Math.round(kv[1] / tot * 100) + "%）" }; }), tot + "", "GB"));
    document.getElementById("tbl").innerHTML = App.table(["Application", "Category", "Traffic", "Users", "Risk"], rows.map(function (r) {
      return { cls: "clickable", attr: 'data-app="' + App.esc(r.name) + '"', tip: "【" + r.name + "】" + r.cat + " ／ " + r.gb + " GB ／ " + r.users + " 人 ／ リスク " + r.risk + "\nクリックで詳細を表示します。",
        cells: [App.esc(r.name), App.esc(r.cat), '<span class="num">' + r.gb + " GB</span>", '<span class="num">' + r.users + "</span>", App.sev(r.risk === "High" ? "High" : r.risk === "Medium" ? "Medium" : "Low")] };
    }));
    document.querySelectorAll("[data-app]").forEach(function (tr) { tr.onclick = function () {
      const r = rows.find(function (x) { return x.name === tr.dataset.app; });
      App.panel({ title: r.name, model: {}, applyLabel: "閉じる", sections: [{ title: "概要", open: true, fields: [{ type: "info", key: "_", html: "<span>カテゴリ：<b>" + App.esc(r.cat) + "</b><br>通信量：<b>" + r.gb + " GB</b>（全体の " + Math.round(r.gb / tot * 100) + "%）<br>利用者：<b>" + r.users + " 人</b><br>リスク：<b>" + r.risk + "</b></span>" }] },
        { title: "この画面からできること", open: true, fields: [{ type: "info", key: "_2", html: "<span>・帯域を下げたい → <a href=\"network-rules.html\">Network Rules</a> で優先度を下げる<br>・使わせたくない → <a href=\"internet-firewall.html\">Internet Firewall</a> で Block<br>・アップロードだけ止めたい → <a href=\"app-control.html\">Application Control</a></span>" }] }], onApply: function () {} });
    }; });
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("site").innerHTML = '<option value="all">All Sites</option>' + App.sites().map(function (s) { return '<option value="' + s.id + '">' + App.esc(s.name) + "</option>"; }).join("");
    document.getElementById("trWrap").innerHTML = App.timeRange();
    document.getElementById("site").onchange = draw; document.getElementById("tr").onchange = draw; draw();
  });
})();
</script>

</body>
</html>
