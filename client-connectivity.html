<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Connectivity Policy | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="access" data-page="client-connectivity" data-crumb="Client Connectivity Policy">
<main class="main" id="main">
  <div class="page-title"><h1>Client Connectivity Policy</h1><span class="muted">Kato Client でのリモート接続を許可する条件</span></div>
  <div class="tip"><span><b>注意：</b>どのルールにも当たらない端末は、一番下の既定ルール（<b>ANY ANY Block</b>）で接続できなくなります。ルールは上から順に評価され、デバイスポスチャの条件を満たさない場合は次のルールへ進みます。Device Checks は Windows / macOS の Client のみ対応です。</span></div>
  <div id="pol"></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/lab-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n-en-kmc.js"></script>
<script src="assets/i18n-en-pages.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
App.policy({
  mount: "#pol", key: "ccp", title: "Client Connectivity Policy", ruleNoun: "Client Connectivity Rule",
  hasEnable: true, enableLabel: "Enable Policy", enabledText: "有効", disabledText: "無効：条件によらず接続を許可",
  seed: function () { return { enabled: true, rules: [
    { id: "c1", name: "Corporate Devices", enabled: true, users: ["Group: 全社員"], platforms: ["Windows", "macOS"], countries: [], posture: ["Corporate Device (Domain Joined)", "Antivirus Running"], action: "Allow WAN and Internet" },
    { id: "c2", name: "Mobile Devices", enabled: true, users: ["Group: 全社員"], platforms: ["iOS", "Android"], countries: [], posture: [], action: "Allow Internet only" }
  ] }; },
  newRule: function () { return { name: "", enabled: true, users: [], platforms: [], countries: [], posture: [], action: "Allow WAN and Internet" }; },
  columns: [
    { h: "Name", v: function (r) { return App.esc(r.name) + (r._new ? ' <span class="badge b-info">New</span>' : ""); } },
    { h: "Users/Groups", v: function (r) { return App.chipsCell(r.users); } },
    { h: "Platforms", v: function (r) { return App.chipsCell(r.platforms); } },
    { h: "Countries", v: function (r) { return App.chipsCell(r.countries); } },
    { h: "Device Posture Profiles", v: function (r) { return App.chipsCell(r.posture); } },
    { h: "Action", v: function (r) { return App.actionBadge(r.action); } }
  ],
  sections: [
    { title: "Users/Groups", fields: [{ key: "users", label: "Users/Groups", type: "picker", options: App.opt.usersGroups }] },
    { title: "Platforms", fields: [{ key: "platforms", label: "Platforms", type: "picker", options: App.opt.platforms }] },
    { title: "Countries", fields: [{ key: "countries", label: "Countries", type: "picker", options: App.opt.countries }] },
    { title: "Device Posture Profiles", fields: [{ key: "posture", label: "Device Posture Profiles", type: "picker", options: App.opt.posture, help: "複数選ぶと OR 条件。Any＝プロファイル条件なし。" }] },
    { title: "Action", fields: [{ key: "action", label: "Action", type: "select", options: ["Allow WAN and Internet", "Allow Internet only", "Block WAN and Internet"],
      help: "Allow Internet only：社内システムには入れず、インターネットのみ（条件を満たさない端末向け）。" }], summary: function (m) { return m.action; } }
  ],
  implicitBottom: { tip: "【既定ルール：Any Any Block】どのルールにも一致しない端末は、リモート接続できません。有効化する前に、自分の端末が上のルールに一致するか確認します。", cells: ["<b>Default</b>（implicit）", '<span class="muted">Any</span>', '<span class="muted">Any</span>', '<span class="muted">Any</span>', '<span class="muted">Any</span>', App.actionBadge("Block WAN and Internet")] },
  onPublish: function (pub, prev) {
    if (pub.rules.some(function (r) { return !prev.rules.some(function (p) { return p.id === r.id; }); })) App.complete("ccp_rule");
  }
});
</script>

</body>
</html>
