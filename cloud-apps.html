<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Apps | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="monitoring" data-page="cloud-apps" data-crumb="Cloud Apps">
<main class="main" id="main">
  <div class="page-title"><h1>Cloud Apps</h1><span class="muted">社内で使われているクラウドサービス（シャドーIT の可視化）</span></div>
  <div class="tip"><span><b>使い方：</b>会社が認めていない（Unsanctioned）のに使われているサービスを見つけます。行の［Sanctioned / Unsanctioned］を切り替えて棚卸しし、使わせたくないものは Application Control や Internet Firewall で制御します。</span></div>
  <div id="tiles"></div>
  <div class="grid2"><div id="c1"></div><div id="c2"></div></div>
  <div class="card"><div class="card-h"><h2>Discovered Applications</h2><div class="btn-group" style="margin-left:auto"><select class="select" id="flt" style="width:auto" aria-label="絞り込み" data-tip="承認状態で絞り込みます。"><option value="">All</option><option>Sanctioned</option><option>Unsanctioned</option><option>Unreviewed</option></select></div></div><div id="tbl"></div></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  let apps = App.db.get("cloudApps", [
    { n: "Microsoft 365", c: "Office", u: 182, r: 1, s: "Sanctioned" }, { n: "Box", c: "File Sharing", u: 88, r: 2, s: "Sanctioned" }, { n: "Salesforce", c: "CRM", u: 41, r: 2, s: "Sanctioned" },
    { n: "Dropbox", c: "File Sharing", u: 9, r: 6, s: "Unreviewed" }, { n: "Google Drive（個人）", c: "File Sharing", u: 14, r: 7, s: "Unreviewed" }, { n: "ChatGPT", c: "Generative AI", u: 37, r: 6, s: "Unreviewed" },
    { n: "WeTransfer", c: "File Transfer", u: 5, r: 8, s: "Unsanctioned" }, { n: "LINE", c: "Messaging", u: 22, r: 5, s: "Unreviewed" }, { n: "Notion", c: "Collaboration", u: 6, r: 4, s: "Unreviewed" }, { n: "Zoom", c: "Collaboration", u: 52, r: 2, s: "Sanctioned" }]);
  function draw() {
    const f = document.getElementById("flt").value;
    const cnt = function (x) { return apps.filter(function (a) { return a.s === x; }).length; };
    document.getElementById("tiles").innerHTML = App.tiles([{ label: "Discovered Apps", value: apps.length, tone: "brand", tip: "通信から見つかったクラウドサービス数" },
      { label: "Sanctioned", value: cnt("Sanctioned"), tone: "ok", tip: "会社が利用を認めたサービス" }, { label: "Unsanctioned", value: cnt("Unsanctioned"), tone: "ng", tip: "利用を認めていないサービス" },
      { label: "Unreviewed", value: cnt("Unreviewed"), tone: "warn", tip: "まだ判断していないサービス（シャドーIT の候補）。棚卸しします" }]);
    const bins = [0, 0, 0]; apps.forEach(function (a) { bins[a.r >= 7 ? 2 : a.r >= 4 ? 1 : 0]++; });
    document.getElementById("c1").innerHTML = App.card("Risk Score 分布", App.donut([{ label: "Low（1-3）", value: bins[0], color: "#0b66f0" }, { label: "Medium（4-6）", value: bins[1], color: "#e58a00" }, { label: "High（7-10）", value: bins[2], color: "#d6333b", tip: "高リスク：" + bins[2] + " 件。データ持ち出しの経路になりやすいサービスです。" }], String(apps.length), "apps"));
    document.getElementById("c2").innerHTML = App.card("Top Unreviewed（利用者数）", App.bars(apps.filter(function (a) { return a.s !== "Sanctioned"; }).sort(function (a, b) { return b.u - a.u; }).slice(0, 5).map(function (a) { return { label: a.n, value: a.u, text: a.u + " 人", color: a.r >= 7 ? "var(--ng)" : "var(--warn)", tip: a.n + "：" + a.u + " 人が利用（リスク " + a.r + "/10）\n業務で必要か確認し、承認するか制御するかを決めます。" }; })));
    document.getElementById("tbl").innerHTML = App.table(["Application", "Category", "Users", "Risk Score", "Status"], apps.filter(function (a) { return !f || a.s === f; }).map(function (a) {
      return { tip: "【" + a.n + "】" + a.c + " ／ 利用者 " + a.u + " 人 ／ リスク " + a.r + "/10\n状態：" + { Sanctioned: "承認済み", Unsanctioned: "未承認（制御の対象）", Unreviewed: "未判断" }[a.s] + "。右の選択で変更できます。",
        cells: [App.esc(a.n), App.esc(a.c), '<span class="num">' + a.u + "</span>", '<span class="badge ' + (a.r >= 7 ? "b-ng" : a.r >= 4 ? "b-warn" : "b-ok") + '">' + a.r + " / 10</span>",
          '<select class="select" data-st="' + App.esc(a.n) + '" style="width:auto;height:26px" aria-label="承認状態">' + ["Sanctioned", "Unsanctioned", "Unreviewed"].map(function (x) { return "<option " + (x === a.s ? "selected" : "") + ">" + x + "</option>"; }).join("") + "</select>"] };
    }));
    document.querySelectorAll("[data-st]").forEach(function (sel) { sel.onchange = function () { const a = apps.find(function (x) { return x.n === sel.dataset.st; }); a.s = sel.value; App.db.set("cloudApps", apps); App.audit("Cloud Apps", "Update", a.n, "Status → " + a.s); App.toast(App.esc(a.n) + " を " + a.s + " にしました。" + (a.s === "Unsanctioned" ? "制御するには Application Control でルールを作ります。" : ""), "ok", 5000); draw(); }; });
  }
  document.addEventListener("DOMContentLoaded", function () { document.getElementById("flt").onchange = draw; draw(); });
})();
</script>

</body>
</html>
