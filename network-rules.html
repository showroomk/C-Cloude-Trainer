<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Rules | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="network" data-page="network-rules" data-crumb="Network Rules">
<main class="main" id="main">
  <div class="page-title"><h1>Network Rules</h1><span class="muted">経路・優先度（QoS）・出口（Route Via / NAT）の制御</span></div>
  <div class="tip"><span><b>ポイント：</b>Source・App/Category・Destination の間は AND 条件。<b>Bandwidth Priority は数字が小さいほど優先</b>（新規ルールの既定は p255）。Internet ルールの Route/NAT で <b>NAT</b> を選ぶと、IP Allocation で割り当てた固定IPから外に出せます。Route Via / NAT を使うルールは Source か App を必ず具体的に指定します。</span></div>
  <div id="pol"></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/lab-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n-en-kmc.js"></script>
<script src="assets/i18n-en-pages.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  const allocated = function () { return App.db.get("ipalloc", []).map(function (a) { return a.ip + "（" + a.loc + "）"; }); };
  const prios = function () { return App.db.get("bw", null) ? App.db.get("bw").map(function (b) { return ["p" + b.priority, "p" + b.priority + "（" + b.name + "）"]; }) : [["p10", "p10"], ["p20", "p20"], ["p30", "p30"], ["p255", "p255"]]; };
  App.policy({
    mount: "#pol", key: "nr", title: "Network Rules", ruleNoun: "Network Rule", newMenu: true,
    seed: function () { return { enabled: true, rules: [
      { id: "n1", name: "Web Conferencing", enabled: true, ruleType: "Internet", source: [], dest: [], app: ["App: Microsoft Teams", "App: Zoom"], prio: "p255", primary: "Kato", secondary: "None", routeNat: "None", routeVia: "Tokyo", natIp: "" },
      { id: "n2", name: "Microsoft 365", enabled: true, ruleType: "Internet", source: [], dest: [], app: ["App: Microsoft 365"], prio: "p30", primary: "Kato", secondary: "None", routeNat: "None", routeVia: "Tokyo", natIp: "" },
      { id: "n3", name: "WAN - Default", enabled: true, ruleType: "WAN", source: [], dest: [], app: [], prio: "p20", primary: "Kato", secondary: "Automatic", routeNat: "None", routeVia: "Tokyo", natIp: "" }
    ] }; },
    newRule: function () { return { name: "", enabled: true, ruleType: "Internet", source: [], dest: [], app: [], prio: "p255", primary: "Kato", secondary: "None", routeNat: "None", routeVia: "Tokyo", natIp: allocated()[0] || "" }; },
    columns: [
      { h: "Name", v: function (r) { return App.esc(r.name) + (r._new ? ' <span class="badge b-info">New</span>' : ""); } },
      { h: "Rule Type", v: function (r) { return '<span class="badge ' + (r.ruleType === "WAN" ? "b-gray" : "b-info") + '">' + r.ruleType + "</span>"; } },
      { h: "Source", v: function (r) { return App.chipsCell(r.source); } },
      { h: "Destination", v: function (r) { return r.ruleType === "WAN" ? App.chipsCell(r.dest) : '<span class="muted">Internet</span>'; } },
      { h: "App/Category", v: function (r) { return App.chipsCell(r.app); } },
      { h: "Bandwidth Priority", v: function (r) { return '<span class="mono">' + App.esc(r.prio) + "</span>"; } },
      { h: "Transport", v: function (r) { return App.esc(r.primary) + " / " + App.esc(r.secondary); } },
      { h: "Route/NAT", v: function (r) { return r.ruleType !== "Internet" || r.routeNat === "None" ? '<span class="muted">—</span>' : r.routeNat === "NAT" ? "NAT: " + App.esc(r.natIp) : "Route Via: " + App.esc(r.routeVia); } }
    ],
    generalExtra: [{ key: "ruleType", label: "Rule Type", type: "select", options: ["Internet", "WAN"], rerender: true, help: "WAN＝社内（拠点・ユーザー・クラウド）間、Internet＝インターネット向け。" }],
    sections: [
      { title: "Source", fields: [{ key: "source", label: "Source", type: "picker", options: App.opt.sources }] },
      { title: "Destination", showIf: function (m) { return m.ruleType === "WAN"; }, fields: [{ key: "dest", label: "Destination（WANルールのみ）", type: "picker", options: App.opt.destinations }] },
      { title: "App/Category", fields: [{ key: "app", label: "App/Category", type: "picker", options: App.opt.apps }] },
      { title: "Configuration", open: true, summary: function (m) { return m.prio + (m.ruleType === "Internet" && m.routeNat !== "None" ? " / " + m.routeNat : ""); }, fields: [
        { key: "prio", label: "Bandwidth Priority", type: "select", options: prios, help: "数字が小さいほど優先。Web会議・電話は高い優先度（小さい数字）に。" },
        { key: "primary", label: "Primary Transport", type: "select", options: ["Kato", "Internet (Off-Cloud)", "Automatic"] },
        { key: "secondary", label: "Secondary Transport", type: "select", options: ["None", "Automatic", "Kato", "Internet (Off-Cloud)"] },
        { key: "routeNat", label: "Route/NAT（Internet ルールのみ）", type: "select", options: ["None", "Route Via", "NAT"], rerender: true, showIf: function (m) { return m.ruleType === "Internet"; } },
        { key: "routeVia", label: "Route Via - Locations", type: "select", options: App.opt.locations, showIf: function (m) { return m.ruleType === "Internet" && m.routeNat === "Route Via"; } },
        { key: "natIp", label: "NAT - Allocated IPs", type: "select", options: function () { const a = allocated(); return a.length ? a : [["", "（割り当て済みIPがありません）"]]; }, showIf: function (m) { return m.ruleType === "Internet" && m.routeNat === "NAT"; },
          help: "Network > アイピー・アロケーション で先に固定IPを割り当てておきます。" }
      ] }
    ],
    validate: function (m) {
      if (m.ruleType === "Internet" && m.routeNat === "NAT" && !m.natIp) return "NAT に使う Allocated IP がありません。先に Network > アイピー・アロケーション で割り当ててください。";
      if (m.ruleType === "Internet" && m.routeNat !== "None" && !m.source.length && !m.app.length) App.toast("ベストプラクティス：Route Via / NAT のルールは Source か App/Category を具体的に指定しましょう。", "warn", 6000);
      if (m.ruleType !== "WAN") m.dest = [];
      return null;
    },
    onPublish: function (pub) {
      if (pub.rules.some(function (r) { return r.enabled && r.ruleType === "Internet" && r.routeNat === "NAT" && r.natIp; })) App.complete("nr_nat");
      if (pub.rules.some(function (r) { return r.enabled && r.prio !== "p255" && r.app.some(function (a) { return /Teams|Zoom/.test(a); }); })) App.complete("nr_qos");
    }
  });
})();
</script>

</body>
</html>
