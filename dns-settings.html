<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DNS Settings | KMC Trainer</title>
<meta name="description" content="SASE 管理画面の操作の流れを練習する非公式・非営利の学習用シミュレーター（架空の製品）">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tab="network" data-page="dns" data-crumb="DNS Settings">
<main class="main" id="main">
  <div class="page-title"><h1>DNS Settings</h1><span class="muted">DNS サーバと社内ドメインの転送先</span></div>
  <div class="tip"><span><b>よくある問い合わせ「在宅だと社内サーバの名前が引けない」の対処画面です。</b>社内ドメイン（例：corp.example.local）を社内の DNS サーバ（例：10.10.0.10）へ転送する設定を <b>Domain Forwarding</b> に追加し、［Save］します。</span></div>
  <div class="card"><div class="card-h"><h2>DNS Servers</h2></div><div class="card-b" style="max-width:640px">
    <div class="field"><span class="lbl">Primary DNS</span><label class="check" data-tip="Kato の DNS を使います（推奨）。DNS 保護も効きます。"><input type="radio" name="dnsmode" value="kato" id="mKato">Kato DNS（10.255.255.53）</label><label class="check" data-tip="自社で指定した DNS サーバを使います。"><input type="radio" name="dnsmode" value="custom" id="mCustom">Custom DNS</label></div>
    <div class="row2"><div class="field"><label for="d1">Custom Primary</label><input class="input" id="d1" placeholder="例：8.8.8.8"></div><div class="field"><label for="d2">Custom Secondary</label><input class="input" id="d2" placeholder="例：1.1.1.1"></div></div>
  </div></div>
  <div class="card"><div class="card-h"><h2>Domain Forwarding（条件付き転送）</h2><span class="muted">このドメインの問い合わせは、指定の DNS サーバへ</span></div>
    <div class="card-b"><div class="row3"><div class="field"><label for="fd">Domain</label><input class="input" id="fd" placeholder="例：corp.example.local"></div><div class="field"><label for="fs">DNS Server</label><input class="input" id="fs" placeholder="例：10.10.0.10"></div><div class="field"><button class="btn" id="add" type="button" data-tip="入力したドメインと転送先を一覧に追加します。最後に Save が必要です。">＋ Add</button></div></div></div>
    <div id="tbl"></div>
    <div class="status-banner pub" id="banner"></div>
    <div class="card-b"><button class="btn btn-primary" id="save" type="button">Save</button></div>
  </div>
</main>
<script src="assets/app.js"></script>
<script src="assets/lab-bridge.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/i18n-en-kmc.js"></script>
<script src="assets/i18n-en-pages.js"></script>
<script src="assets/challenges.js"></script>
<script src="assets/trainer.js"></script>
<script>
(function () {
  let D = App.db.get("dns", { mode: "kato", d1: "", d2: "", fwd: [] });
  let dirty = false;
  function draw() {
    document.getElementById("tbl").innerHTML = App.table(["Domain", "DNS Server", ""], D.fwd.map(function (f, i) {
      return { tip: "【" + f.d + "】このドメインの名前解決は " + f.s + " に転送されます。リモートユーザーも社内サーバの名前を引けます。", cells: ['<span class="mono">' + App.esc(f.d) + "</span>", '<span class="mono">' + App.esc(f.s) + "</span>", '<button class="kebab" type="button" data-del="' + i + '" aria-label="削除" data-tip="この転送設定を削除します。">' + App.icon("trash") + "</button>"] };
    }), { empty: "転送設定がありません。社内ドメインを追加しましょう。" });
    const b = document.getElementById("banner");
    b.className = "status-banner " + (dirty ? "dirty" : "pub");
    b.innerHTML = dirty ? "<b>未保存の変更があります。</b>［Save］で反映します。" : "保存済みの設定を表示しています。";
    document.getElementById("save").disabled = !dirty;
    document.querySelectorAll("[data-del]").forEach(function (x) { x.onclick = function () { D.fwd.splice(+x.dataset.del, 1); dirty = true; draw(); }; });
  }
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById(D.mode === "kato" ? "mKato" : "mCustom").checked = true;
    document.getElementById("d1").value = D.d1; document.getElementById("d2").value = D.d2;
    document.querySelectorAll('input[name="dnsmode"], #d1, #d2').forEach(function (el) { el.addEventListener("input", function () { dirty = true; draw(); }); el.addEventListener("change", function () { dirty = true; draw(); }); });
    document.getElementById("add").onclick = function () {
      const d = document.getElementById("fd").value.trim(), s = document.getElementById("fs").value.trim();
      if (!d || !/^\d{1,3}(\.\d{1,3}){3}$/.test(s)) { App.toast("Domain と、DNS Server の IP アドレス（例：10.10.0.10）を入力してください。", "ng"); return; }
      D.fwd.push({ d: d, s: s }); dirty = true; App.step("dns_fwd", "add"); document.getElementById("fd").value = ""; document.getElementById("fs").value = ""; draw();
    };
    document.getElementById("save").onclick = function () {
      D.mode = document.querySelector('input[name="dnsmode"]:checked').value; D.d1 = document.getElementById("d1").value; D.d2 = document.getElementById("d2").value;
      App.db.set("dns", D); dirty = false; App.audit("DNS Settings", "Save", "DNS", D.fwd.map(function (f) { return f.d + "→" + f.s; }).join(", ") || "no forwarding");
      if (D.fwd.length) App.complete("dns_fwd");
      App.toast("DNS 設定を保存しました。", "ok"); draw();
    };
    draw();
  });
})();
</script>

</body>
</html>
